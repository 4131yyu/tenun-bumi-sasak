<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tenun Bumi Sasak</title>
  </head>

  <body class="bg-gray-50 dark:bg-gray-950">
    <header
      class="border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900"
    >
      <div
        class="mx-auto flex h-16 max-w-7xl items-center gap-8 px-4 sm:px-6 lg:px-8"
      >
        <a href="#" class="flex items-center gap-2 text-xl">
          <span class="font-bold text-lime-700 dark:text-lime-400">Tenun</span>
          <span class="font-medium dark:text-white">Bumi Sasak</span>
        </a>

        <div class="flex flex-1 items-center justify-end md:justify-between">
          <nav aria-label="Global" class="hidden md:block">
            <ul class="flex items-center gap-6 text-sm">
              <li>
                <a
                  class="border-b-2 border-lime-500 pb-5 text-sm font-medium text-gray-900 dark:border-lime-400 dark:text-white"
                  href="#"
                  >Beranda</a
                >
              </li>
              <li>
                <a
                  class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-white/75"
                  href="#"
                  >Produk</a
                >
              </li>
              <li>
                <a
                  class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-white/75"
                  href="#"
                  >Tentang</a
                >
              </li>
              <li>
                <a
                  class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-white/75"
                  href="#"
                  >Kontak</a
                >
              </li>
            </ul>
          </nav>

          <div class="flex items-center gap-4">
            <div class="relative hidden sm:block">
              <label class="sr-only" for="search">Search</label>
              <input
                class="h-10 w-full rounded-lg border-none bg-gray-100 ps-4 pe-10 text-sm shadow-sm sm:w-56 dark:bg-gray-800 dark:text-white"
                id="search"
                type="search"
                placeholder="Cari produk..."
              />
              <button
                type="button"
                class="absolute end-1 top-1/2 -translate-y-1/2 rounded-md bg-white p-2 text-gray-600 transition hover:text-gray-700 dark:bg-gray-900 dark:text-gray-300 dark:hover:text-gray-200"
              >
                <span class="sr-only">Search</span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="size-4"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                  />
                </svg>
              </button>
            </div>

            <a
              href="#"
              class="hidden shrink-0 rounded-lg bg-lime-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-lime-700 sm:block"
            >
              Hubungi Kami
            </a>

            <button
              id="menu-btn"
              class="block rounded bg-gray-100 p-2.5 text-gray-600 transition hover:text-gray-600/75 md:hidden dark:bg-gray-800 dark:text-white dark:hover:text-white/75"
            >
              <span class="sr-only">Toggle menu</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="size-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile menu -->
      <div
        id="mobile-menu"
        class="hidden border-t border-gray-200 bg-white md:hidden dark:border-gray-800 dark:bg-gray-900"
      >
        <nav class="flex flex-col gap-1 px-4 py-3">
          <a
            href="#"
            class="rounded-md px-3 py-2 text-sm font-medium text-gray-900 bg-gray-100 dark:text-white dark:bg-gray-800"
            >Beranda</a
          >
          <a
            href="#"
            class="rounded-md px-3 py-2 text-sm text-gray-500 hover:bg-gray-100 dark:text-white dark:hover:bg-gray-800"
            >Produk</a
          >
          <a
            href="#"
            class="rounded-md px-3 py-2 text-sm text-gray-500 hover:bg-gray-100 dark:text-white dark:hover:bg-gray-800"
            >Tentang</a
          >
          <a
            href="#"
            class="rounded-md px-3 py-2 text-sm text-gray-500 hover:bg-gray-100 dark:text-white dark:hover:bg-gray-800"
            >Kontak</a
          >
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
      <p class="text-gray-500 dark:text-gray-400">Konten halaman di sini...</p>
    </main>

    <script>
      const btn = document.getElementById("menu-btn");
      const menu = document.getElementById("mobile-menu");
      btn.addEventListener("click", () => menu.classList.toggle("hidden"));
    </script>
  </body>
</html>
